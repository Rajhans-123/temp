name: weekly-retrain

# Weekly Jikan live-sync + retrain.
# - scheduled every Monday 03:00 UTC (cron is UTC)
# - also runnable by hand from the Actions tab (workflow_dispatch) with the
#   same knobs retrain_weekly.py accepts.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      top:
        description: "Refresh top N titles by members (empty = stale-based weekly default)"
        required: false
        default: ""
      stale_days:
        description: "Titles not synced in the last N days"
        required: false
        default: "7"
      stages:
        description: "Train stages to run (space separated, default 2 3 4 5 6)"
        required: false
        default: "2 3 4 5 6"
      force:
        description: "Retrain even if nothing changed (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Offline self-test (no network)
        run: python sync_jikan.py --self-test

      - name: Weekly Jikan sync + retrain
        run: |
          ARGS="--stale ${{ inputs.stale_days || '7' }} --stages ${{ inputs.stages || '2 3 4 5 6' }}"
          if [ -n "${{ inputs.top }}" ]; then ARGS="--top ${{ inputs.top }} --stages ${{ inputs.stages || '2 3 4 5 6' }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          # CI has no 1 GB ratings.csv: retrain_weekly.py falls back to an
          # anime-only rebuild and runs each stage in isolation, so a stage
          # that needs ratings (user baskets / recommender affinity) is
          # recorded as failed and the rest still complete.
          python retrain_weekly.py $ARGS || [ $? -eq 2 ]
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload retrained artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-retrain-reports
          path: |
            reports/retrain_log.csv
            reports/mining_summary.csv
            reports/preprocessing_outliers.csv
            data/live/last_sync.csv
            data/live/score_history.csv
          if-no-files-found: warn

      - name: Commit refreshed data (reports + live state only, never models/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/retrain_log.csv reports/mining_summary.csv \
            data/live/last_sync.csv data/live/score_history.csv \
            data/raw/anime.csv 2>/dev/null || true
          git diff --cached --quiet && echo "nothing changed, skipping commit" && exit 0
          git commit -m "weekly Jikan retrain $(date -u +%F)"
          git push
